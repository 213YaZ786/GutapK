name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: test
        run: gradle --no-daemon test

      - name: app image
        run: gradle --no-daemon createDistributable

      - name: appimage
        run: bash packaging/make-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: GutapK-x86_64
          path: |
            dist/GutapK-x86_64.AppImage
            dist/GutapK-x86_64.AppImage.sha256

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/GutapK-x86_64.AppImage
            dist/GutapK-x86_64.AppImage.sha256
